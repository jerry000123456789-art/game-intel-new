name: Add owner-selected game to cloud watchlist
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
concurrency:
  group: owner-watchlist
  cancel-in-progress: false
jobs:
  accept:
    if: ${{ github.event.issue.user.login == 'jerry000123456789-art' && startsWith(github.event.issue.title, '[追蹤遊戲] ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and append game
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python scripts/add_tracked_from_issue.py "$EVENT_PATH"
      - name: Save tracking configuration
        run: |
          git add config/tracked_games.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add owner selected tracking game'
          git push origin HEAD:main
