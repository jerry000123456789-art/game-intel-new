name: Verify business dashboard features
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/business-smoke.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test business dashboard, release examples and tracking
        run: |
          node --check business.js
          node tests/test_business_ui.mjs
          node tests/test_business_runtime.mjs
          node tests/test_watchlist_api.mjs
          python scripts/test_tracked_events.py
          python scripts/validate_site.py
          python scripts/test_frontend_js.py
          python scripts/build_private.py
          test -s public/business.js
          test -s public/business.css
