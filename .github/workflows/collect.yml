name: Collect and validate public game intelligence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_radar.py'
      - 'scripts/build_radar.py'
      - 'scripts/test_radar.py'
      - 'tests/test_radar.mjs'
      - 'config/radar_sources.json'
      - 'index.html'
      - 'radar.js'
      - 'radar.css'
      - 'scripts/build_private.py'
      - 'scripts/validate_site.py'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: focused-game-radar-collector
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout latest radar
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source parser, identity, and UI
        run: |
          python -m py_compile scripts/collect_radar.py scripts/build_radar.py
          python scripts/test_radar.py
          node --check radar.js
          node tests/test_radar.mjs
      - name: Discover Google Play and Apple games
        run: python scripts/collect_radar.py
      - name: Merge verified game identities, market status and dates
        run: python scripts/build_radar.py
      - name: Validate focused site assets and public data
        run: |
          python scripts/validate_site.py
          python scripts/build_private.py
      - name: Commit radar data without overwriting simultaneous changes
        run: |
          git add data/radar_discoveries.json data/radar_catalog.json data/radar_summary.json data/radar_health.json
          if git diff --cached --quiet; then
            echo "No new game intelligence changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update focused game radar data and source health'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Data changed simultaneously; avoid overwriting source evidence."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Radar data updated on latest main."
              exit 0
            fi
            sleep 4
          done
          exit 1
