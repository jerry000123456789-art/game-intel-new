name: Collect public game headlines
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect RSS and organize leads
        run: |
          python scripts/collect.py
          python scripts/classify.py
          python scripts/launch_leads.py
          python scripts/game_catalog.py
      - name: Commit updated data
        run: |
          git add data/latest.json data/classified.json data/launch_leads.json data/game_catalog.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update game intelligence data'
            git push
          fi
