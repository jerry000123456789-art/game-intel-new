name: Verify mobile game release and artwork logic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-smoke.yml'
permissions:
  contents: read
jobs:
  mobile-release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check mobile-only status and official artwork
        run: |
          python scripts/test_mobile_store.py
          python scripts/test_live_pipeline.py
          python scripts/test_frontend_js.py
          node tests/test_release_ui.mjs
          node tests/test_code_list.mjs
