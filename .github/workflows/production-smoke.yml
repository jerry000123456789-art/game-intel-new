name: Verify Cloudflare production site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'scripts/check_production.py'
  workflow_run:
    workflows: ['Collect and validate public game intelligence']
    types: [completed]
  schedule:
    - cron: '47 */3 * * *'
permissions:
  contents: read
concurrency:
  group: cloudflare-production-smoke
  cancel-in-progress: false
jobs:
  external-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify Cloudflare HTML or access redirect
        run: |
          python - <<'PY'
          import re,urllib.request
          base='https://game-intel-new.jerry000123456789.workers.dev'
          paths=['/','/data/coverage_status.json','/api/lookup?game=%E5%8E%9F%E7%A5%9E&kind=events']
          for path in paths:
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as resp:
                      b=resp.read(120000).decode('utf-8','replace')
                      title=re.search(r'<title[^>]*>(.*?)</title>',b,re.I|re.S)
                      print('PROBE',path,'status',resp.status,'type',resp.headers.get('Content-Type'),'final_url',resp.url,'title',(title.group(1).strip()[:150] if title else 'no title'),'cf-mitigated',resp.headers.get('cf-mitigated'),'server',resp.headers.get('server'),'body_head',b[:100].replace(chr(10),' '))
              except Exception as ex:print('PROBE',path,'ERROR',str(ex)[:250])
          PY
      - name: Verify deployed HTML, JSON data, and live event/guide searches
        env:
          ATTEMPTS: '1'
        run: python scripts/check_production.py
