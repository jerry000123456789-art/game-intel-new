<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球遊戲情報中心</title>
<style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#2D3142;background:#EAEAEF;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #d6dce6}header .wrap{padding:22px 0}h1{font-size:26px;color:#244568;margin:0}h2{font-size:23px;margin:0 0 18px}h3{font-size:18px;margin:0 0 10px}.muted{color:#64748b}.wrap{max-width:1260px;margin:auto;padding:24px 20px}nav,.subnav,.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}button,input,select{font:inherit;border:1px solid #cbd5e1;border-radius:11px;padding:11px 15px;background:white;color:#2D3142}button{cursor:pointer}button:hover{border-color:#244568}button.active{background:#244568;color:white;border-color:#244568}.subnav button.active{background:#176a60;border-color:#176a60}.filters input{flex:1;min-width:200px}.panel,.card{background:white;border:1px solid #d4dce6;border-radius:16px;padding:22px}.panel{margin-bottom:18px}.card{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.item{padding:15px 0;border-top:1px solid #e5eaf0}.item:first-child{border-top:0}.item a{color:#244568;font-weight:600;text-decoration:none}.item a:hover{text-decoration:underline}.tag{font-size:12px;background:#e1edf0;color:#176a60;padding:3px 8px;border-radius:99px;display:inline-block;margin-right:7px}.small{font-size:13px}.hidden{display:none!important}.empty{padding:22px;background:#f5f7fa;border-radius:12px;color:#64748b}.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;gap:15px}.sidebar button{display:block;width:100%;text-align:left;margin:0 0 7px}.timeline{overflow:auto}.months{display:flex;gap:10px;align-items:center;margin-bottom:15px}.eventrow{display:grid;grid-template-columns:185px minmax(600px,1fr);gap:10px;padding:10px 0;border-bottom:1px solid #e5eaf0}.track{position:relative;background:repeating-linear-gradient(to right,#f1f5f9 0,#f1f5f9 calc(100% / 31 - 1px),#dce5ef calc(100% / 31 - 1px),#dce5ef calc(100% / 31));height:38px;border-radius:6px}.bar{position:absolute;height:28px;top:5px;border-radius:6px;color:white;font-size:12px;overflow:hidden;white-space:nowrap;padding:5px 8px}.days{display:grid;grid-template-columns:repeat(31,1fr);min-width:600px;font-size:11px;color:#64748b;text-align:center}dialog{border:0;border-radius:16px;max-width:680px;width:calc(100% - 32px);padding:25px;box-shadow:0 20px 70px #17233855}dialog::backdrop{background:#17233877}#toast{position:fixed;bottom:20px;right:20px;background:#244568;color:white;border-radius:9px;padding:12px 18px;display:none}a{overflow-wrap:anywhere}@media(max-width:900px){.layout{grid-template-columns:1fr}.eventrow{grid-template-columns:140px minmax(600px,1fr)}.wrap{padding:18px 12px}h1{font-size:22px}}
</style></head><body>
<header><div class="wrap"><h1>🎮 全球遊戲情報中心</h1><div class="muted">遊戲情報 · 兌換碼 · 攻略 · 活動時間軸</div></div></header>
<main class="wrap"><nav id="mainnav"><button class="active" data-tab="news">遊戲資訊</button><button data-tab="codes">兌換碼</button><button data-tab="guides">遊戲攻略</button><button data-tab="calendar">活動行事曆</button></nav>
<section id="news"><div class="subnav" id="newstabs"><button class="active" data-news="updates">最新遊戲情報</button><button data-news="launches">新上市／即將上市</button></div>
<div id="updates" class="panel"><h2>最新遊戲情報</h2><p class="muted small" id="newsstatus">正在讀取最新資料…</p><div class="filters"><input id="newsquery" placeholder="搜尋遊戲名稱、新聞標題或來源"><select id="newscategory"><option value="">所有分類</option><option value="新遊戲資訊">新遊戲</option><option value="兌換碼">兌換碼消息</option><option value="遊戲攻略">攻略消息</option><option value="活動行事曆">活動消息</option></select><select id="newssort"><option value="new">最新優先</option><option value="old">最舊優先</option></select></div><div id="newsitems"></div><button id="moreNews" class="hidden">顯示更多</button></div>
<div id="launches" class="panel hidden"><h2>新上市／即將上市</h2><div class="filters"><input id="launchquery" placeholder="搜尋遊戲名稱"><select id="launchstatus"><option value="">全部狀態</option><option>新上市</option><option>即將上市</option><option>預約中</option><option>測試中</option><option>上市消息</option></select><select id="launchregion"><option value="">全部地區</option><option>台灣</option><option>日本</option><option>韓國</option><option>美國</option><option>全球</option></select></div><p class="muted small" id="launchhint">上市消息依來源呈現；尚未核對的資訊不當作正式上市日期。</p><div id="launchitems" class="grid"></div></div></section>
<section id="codes" class="hidden panel"><h2>兌換碼</h2><div class="filters"><input id="codequery" placeholder="搜尋遊戲名稱或代碼"></div><p class="muted small">只展示有明確代碼文字及來源的資料；新聞標題不會當成兌換碼。</p><div id="codeitems" class="grid"></div></section>
<section id="guides" class="hidden"><h2>遊戲攻略</h2><div class="layout"><div class="panel sidebar"><h3>選擇遊戲</h3><div id="guidegames"></div></div><div class="panel"><h3 id="guidetitle">攻略文章</h3><div id="guidearticles"></div></div><div class="panel"><h3>分享文案</h3><div id="guidecopy" class="muted">選擇一篇攻略後，這裡會顯示可複製的摘要文案。</div><button id="copyguide" class="hidden">複製文案</button></div></div></section>
<section id="calendar" class="hidden panel"><h2>活動行事曆</h2><div class="months"><button id="prevMonth" aria-label="上個月">‹</button><strong id="monthlabel"></strong><button id="nextMonth" aria-label="下個月">›</button></div><div class="filters"><input id="eventquery" placeholder="篩選遊戲名稱"><select id="eventregion"><option value="">所有地區</option><option>台灣</option><option>日本</option><option>韓國</option><option>美國</option><option>全球</option></select></div><p class="muted small">每個活動獨立一條時間軸，同月份每款遊戲固定使用不同顏色；只顯示有日期依據的活動。</p><div class="timeline"><div id="days" class="eventrow"><div>遊戲／活動</div><div class="days" id="daynumbers"></div></div><div id="eventrows"></div></div></section>
</main><dialog id="detail"><button id="closeDetail" style="float:right">關閉 ✕</button><div id="detailbody"></div></dialog><div id="toast" role="status"></div>
<script>
'use strict';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=v=>{try{let u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};const fmt=v=>{if(!v)return '時間未提供';let d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('zh-TW')};const notify=s=>{let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2500)};
async function load(path){try{let r=await fetch(path,{cache:'no-store'});if(!r.ok)return [];let j=await r.json();return Array.isArray(j)?j:Array.isArray(j.items)?j.items:[]}catch(e){console.warn(path,e);return []}}
async function copy(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s)}else{let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('copy failed');t.remove()}notify('已複製')}catch{notify('複製失敗，請手動選取')}}
function showDetails(html){$('detailbody').innerHTML=html;$('detail').showModal()}$('closeDetail').onclick=()=>$('detail').close();
document.querySelectorAll('#mainnav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mainnav button').forEach(x=>x.classList.toggle('active',x===b));['news','codes','guides','calendar'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});document.querySelectorAll('#newstabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#newstabs button').forEach(x=>x.classList.toggle('active',x===b));['updates','launches'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.news))});
let headlines=[],classified=[],newsLimit=30;function renderNews(){let q=$('newsquery').value.trim().toLowerCase(),cat=$('newscategory').value;let rows=headlines.filter(x=>(!cat||x.category===cat)&&(!q||[x.title,x.publisher,x.category].some(s=>String(s||'').toLowerCase().includes(q))));rows.sort((a,b)=>($('newssort').value==='old'?1:-1)*(new Date(a.published_at||0)-new Date(b.published_at||0)));$('newsitems').innerHTML=rows.slice(0,newsLimit).map(x=>`<div class="item"><span class="tag">${esc(x.category||'情報')}</span><a href="${url(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><div class="muted small">${esc(x.publisher||'來源未提供')} · ${esc(fmt(x.published_at))}</div></div>`).join('')||'<div class="empty">目前沒有符合條件的情報。</div>';$('moreNews').classList.toggle('hidden',rows.length<=newsLimit)};['newsquery','newscategory','newssort'].forEach(id=>$(id).addEventListener('input',()=>{newsLimit=30;renderNews()}));$('moreNews').onclick=()=>{newsLimit+=30;renderNews()};
let launches=[],launchLeads=[],codes=[],guides=[],events=[];function renderLaunch(){let q=$('launchquery').value.toLowerCase(),status=$('launchstatus').value,region=$('launchregion').value;let a=[...launches,...launchLeads].filter(x=>String(x.name||'').toLowerCase().includes(q)&&(!status||x.status===status)&&(!region||x.region===region));$('launchitems').innerHTML=a.map((x,i)=>`<article class="card"><h3>${esc(x.name)}</h3><p><span class="tag">${esc(x.status)}</span>${esc(x.region||'')}</p><p class="muted small">${esc(x.release_date||'上市日期尚未核對')} · ${esc(x.publisher||'')}</p>${x.review_required?'<span class="tag">新聞線索</span>':''}<button data-launch="${i}">查看來源與資料</button></article>`).join('')||'<div class="empty">目前沒有已整理的新上市或即將上市遊戲資料。這裡不顯示假上市日期。</div>';$('launchitems').querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>{let x=a[+b.dataset.launch];showDetails(`<h2>${esc(x.name)}</h2><p>狀態：${esc(x.status)}</p><p>地區：${esc(x.region||'')}</p><p>上市時間：${esc(x.release_date||'未提供')}</p>${(x.platforms||[]).length?`<p>平台：${esc(x.platforms.join('、'))}</p>`:''}${x.source_url?`<p><a href="${url(x.source_url)}" target="_blank" rel="noopener noreferrer">原始新聞來源</a></p>`:''}${x.review_required?'<p class="muted">此筆由新聞標題自動辨識，尚未核對官方公告與上市日期。</p>':''}${(x.store_links||[]).map(y=>`<p><a href="${url(y.url)}" target="_blank" rel="noopener noreferrer">${esc(y.name)}</a></p>`).join('')}<h3>已確認付款方式</h3>${(x.payment_methods||[]).map(y=>`<p>${esc(y.name)} ${y.source_url?`<a href="${url(y.source_url)}" target="_blank" rel="noopener noreferrer">來源</a>`:''}</p>`).join('')||'<p class="muted">目前沒有已確認的付款方式資料。</p>'}`)})};['launchquery','launchstatus','launchregion'].forEach(id=>$(id).addEventListener('input',renderLaunch));
function renderCodes(){let q=$('codequery').value.toLowerCase();let grouped={};codes.filter(x=>x.game&&x.code&&x.source_url&&!x.demo&&[x.game,x.code].some(v=>String(v).toLowerCase().includes(q))).forEach(x=>(grouped[x.game]??=[]).push(x));$('codeitems').innerHTML=Object.entries(grouped).map(([game,items],i)=>`<article class="card"><h3>${esc(game)}</h3>${items.map((x,j)=>`<div class="item"><strong>${esc(x.code)}</strong> <button data-copy-code="${i}-${j}">複製</button>${x.expired===true?'<span class="tag">已過期</span>':''}<div class="muted small">發現：${esc(fmt(x.discovered_at))} · <a href="${url(x.source_url)}" target="_blank" rel="noopener noreferrer">來源</a></div></div>`).join('')}<button data-copy-all="${i}" class="active">複製全部</button></article>`).join('')||'<div class="empty">目前尚無已擷取並附來源的實際兌換碼。新聞線索不會冒充代碼。</div>';$('codeitems').querySelectorAll('[data-copy-code]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.copyCode.split('-').map(Number);copy(Object.values(grouped)[i][j].code)});$('codeitems').querySelectorAll('[data-copy-all]').forEach(b=>b.onclick=()=>copy(Object.values(grouped)[+b.dataset.copyAll].map(x=>x.code).join('\n')))}$('codequery').oninput=renderCodes;
let guideGame='';function renderGuides(){let games=[...new Set(guides.map(x=>x.game).filter(Boolean))];if(!games.includes(guideGame))guideGame=games[0]||'';$('guidegames').innerHTML=games.map((g,i)=>`<button data-game="${i}" class="${g===guideGame?'active':''}">${esc(g)}</button>`).join('')||'<p class="muted">尚無已整理的攻略</p>';$('guidegames').querySelectorAll('button').forEach(b=>b.onclick=()=>{guideGame=games[+b.dataset.game];renderGuides()});let a=guides.filter(x=>x.game===guideGame);$('guidetitle').textContent=guideGame?guideGame+' · 攻略文章':'攻略文章';$('guidearticles').innerHTML=a.map((x,i)=>`<div class="item"><button data-guide="${i}">${esc(x.title)}</button><div class="muted small">更新：${esc(fmt(x.updated_at))}</div></div>`).join('')||'<div class="empty">目前沒有已整理的攻略文章。</div>';$('guidearticles').querySelectorAll('button').forEach(b=>b.onclick=()=>{let x=a[+b.dataset.guide];$('guidearticles').innerHTML=`<button id="backguides">← 返回攻略列表</button><h3>${esc(x.title)}</h3><p style="white-space:pre-wrap">${esc(x.content||'')}</p>${x.source_url?`<a href="${url(x.source_url)}" target="_blank" rel="noopener noreferrer">查看來源</a>`:''}`;$('backguides').onclick=renderGuides;let text=x.share_text||`${x.title}\n${x.source_url||''}`;$('guidecopy').textContent=text;$('copyguide').classList.remove('hidden');$('copyguide').onclick=()=>copy(text)})}
let month=new Date();month.setDate(1);const palette=['#176a60','#244568','#a65331','#8054a0','#b67a17','#bd466d','#407d99','#5e7039','#8c5965','#7366b0'];function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),last=new Date(y,m+1,0).getDate();$('monthlabel').textContent=`${y} 年 ${m+1} 月`;$('daynumbers').innerHTML=Array.from({length:last},(_,i)=>`<span>${i+1}</span>`).join('');$('daynumbers').style.gridTemplateColumns=`repeat(${last},1fr)`;let q=$('eventquery').value.toLowerCase(),r=$('eventregion').value;let start=new Date(y,m,1),end=new Date(y,m,last,23,59,59);let a=events.filter(x=>x.game&&x.name&&x.start_at&&x.end_at&&x.source_url&&(!q||x.game.toLowerCase().includes(q))&&(!r||x.region===r)).filter(x=>new Date(x.start_at)<=end&&new Date(x.end_at)>=start);let games=[...new Set(a.map(x=>x.game))].sort();$('eventrows').innerHTML=a.map(x=>{let s=new Date(x.start_at),e=new Date(x.end_at);let first=Math.max(1,s<start?1:s.getDate()),lastDay=Math.min(last,e>end?last:e.getDate());let left=(first-1)/last*100,width=(lastDay-first+1)/last*100,color=palette[games.indexOf(x.game)%palette.length];return `<div class="eventrow"><div><strong>${esc(x.game)}</strong><div class="small">${esc(x.name)}</div><button data-event="${events.indexOf(x)}">活動資訊</button></div><div class="track"><div class="bar" style="left:${left}%;width:${width}%;background:${color}" title="${esc(x.name)}">${esc(x.name)}</div></div></div>`}).join('')||'<div class="empty">這個月份沒有已確認起迄日期及來源的活動資料。</div>';$('eventrows').querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{let x=events[+b.dataset.event];showDetails(`<h2>${esc(x.name)}</h2><p>${esc(x.game)} · ${esc(x.region||'')}</p><p>開始：${esc(fmt(x.start_at))}</p><p>結束：${esc(fmt(x.end_at))}</p><p>${esc(x.topup_notes||'')}</p><a href="${url(x.source_url)}" target="_blank" rel="noopener noreferrer">官方／原始來源</a>`)})};$('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);renderCalendar()};['eventquery','eventregion'].forEach(id=>$(id).addEventListener('input',renderCalendar));
(async()=>{[headlines,classified,launches,launchLeads,codes,guides,events]=await Promise.all(['data/latest.json','data/classified.json','data/launches.json','data/launch_leads.json','data/codes.json','data/guides.json','data/events.json'].map(load));$('newsstatus').textContent=`目前有 ${headlines.length} 筆公開情報標題。自動分類僅供查找，內容請以原始來源為準。`;renderNews();renderLaunch();renderCodes();renderGuides();renderCalendar()})();
</script><script src="./catalog-ui-fix.js"></script></body></html>
