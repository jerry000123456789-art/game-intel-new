<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球遊戲情報中心</title><style>:root{font-family:system-ui,'Microsoft JhengHei';line-height:1.5;color:#2D3142;background:#EAEAEF}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #d4dae1;padding:22px max(18px,calc((100% - 1160px)/2))}h1{margin:0;color:#24466b;font-size:25px}.wrap{max-width:1160px;margin:auto;padding:20px}nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}button,input,select,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd4dd;background:white;color:#2D3142}button{cursor:pointer}button.active,button.primary{background:#24466b;color:white}section{display:none}section.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:white;border:1px solid #d5dce4;border-radius:13px;padding:16px;margin-bottom:12px}.game{cursor:pointer}.game:hover{border-color:#24466b}.muted{color:#677586;font-size:13px}.tag{display:inline-block;border-radius:12px;padding:2px 8px;background:#e1edf1;color:#246b55;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar input{flex:1;min-width:180px}.cols{display:grid;grid-template-columns:220px 1fr 200px;gap:12px}.cols button{display:block;width:100%;margin-bottom:7px;text-align:left}.cols textarea{width:100%;min-height:250px}.timeline{overflow:auto}.line{display:grid;grid-template-columns:175px minmax(660px,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf0f3}.track{height:24px;background:repeating-linear-gradient(90deg,#f0f3f6 0,#f0f3f6 calc(100%/31 - 1px),#d8e0e8 calc(100%/31 - 1px),#d8e0e8 calc(100%/31));position:relative}.bar{position:absolute;top:4px;height:16px;border-radius:5px}.modalbg{display:none;position:fixed;inset:0;background:#172337a8;align-items:center;justify-content:center;padding:15px}.modalbg.open{display:flex}.modal{background:white;padding:22px;border-radius:14px;width:min(700px,100%);max-height:85vh;overflow:auto}a{color:#24466b}footer{font-size:12px;color:#667586;padding:15px 0}@media(max-width:850px){.cols{grid-template-columns:1fr}.line{grid-template-columns:125px minmax(600px,1fr)}}</style></head><body><header><h1>🎮 全球遊戲情報中心</h1><div class="muted">新遊戲・兌換碼・攻略・活動時間軸</div></header><div class="wrap"><nav><button class="active" onclick="tab(0,this)">新遊戲資訊</button><button onclick="tab(1,this)">兌換碼</button><button onclick="tab(2,this)">遊戲攻略</button><button onclick="tab(3,this)">活動行事曆</button></nav><section class="active"><h2>新遊戲資訊</h2><div class="toolbar"><input id="search" placeholder="搜尋遊戲" oninput="renderGames()"><select id="filter" onchange="renderGames()"><option value="">所有狀態</option><option>新上市</option><option>預計上市</option><option>開放預約</option></select></div><div class="grid" id="games"></div></section><section><h2>兌換碼</h2><div class="toolbar"><input id="codeSearch" placeholder="搜尋遊戲" oninput="renderCodes()"></div><div class="grid" id="codes"></div></section><section><h2>遊戲攻略</h2><div class="cols"><div class="card"><h3>選擇遊戲</h3><div id="guideGames"></div></div><div class="card"><h3 id="guideTitle">攻略</h3><div class="toolbar"><button onclick="guideMode='guide';renderGuide()">攻略文章</button><button onclick="guideMode='ad';renderGuide()">廣告文案</button></div><textarea id="guideBody"></textarea><p><button class="primary" onclick="copy(document.getElementById('guideBody').value)">複製內容</button></p></div><div class="card"><h3>文章資訊</h3><p>示範資料</p><p class="muted">正式資料將附上來源及更新時間。</p></div></div></section><section><h2>遊戲活動行事曆</h2><div class="toolbar"><button onclick="changeMonth(-1)">上個月</button><strong id="month"></strong><button onclick="changeMonth(1)">下個月</button><button onclick="exportCSV()">匯出 CSV</button></div><div class="card timeline"><div id="timeline"></div></div><p class="muted">活動可跨月份查看；同月不同遊戲使用不同顏色，每個活動各有一條時間軸。</p></section><footer>目前為第一階段可操作網站，資料為示例，尚未串接真實自動蒐集來源。</footer></div><div class="modalbg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal"><button style="float:right" onclick="closeModal()">關閉 ✕</button><div id="modalContent"></div></div></div><script>
const names=['原神','鳴潮','崩壞：星穹鐵道','Last War: Survival','絕區零','明日方舟','楓之谷 M','勝利女神：妮姬','寒霜啟示錄','蔚藍檔案','無限暖暖','三國志・戰略版'];const games=names.map((name,i)=>({name,status:['新上市','預計上市','開放預約'][i%3],region:['台灣','日本','美國'][i%3],platform:['Google Play','App Store','Steam'][i%3],date:'示例日期：2027/01/'+String(i+1).padStart(2,'0'),payments:i%2?['信用卡','電信代付']:['信用卡','電子錢包']}));function tab(i,b){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('active',i===j));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function renderGames(){let q=document.getElementById('search').value,f=document.getElementById('filter').value;document.getElementById('games').innerHTML=games.map((g,i)=>({...g,i})).filter(g=>g.name.includes(q)&&(!f||g.status===f)).map(g=>`<div class="card game" onclick="openGame(${g.i})"><h3>${g.name}</h3><span class="tag">${g.status}</span><p>${g.region} · ${g.platform}</p><p class="muted">${g.date}</p></div>`).join('')}function openGame(i){let g=games[i];document.getElementById('modalContent').innerHTML=`<h2>${g.name}</h2><p>上市狀態：${g.status}</p><p>地區：${g.region}</p><p>平台：${g.platform}</p><p>${g.date}</p><h3>付款方式（示例）</h3><p>${g.payments.join('、')}</p>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}async function copy(s){try{await navigator.clipboard.writeText(s);alert('已複製')}catch(e){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();if(ok)alert('已複製');else prompt('請手動複製',s)}}const codeData=names.slice(0,8).map((name,i)=>({name,items:[{code:'DEMO'+(i+1)+'A',date:'2026/11/07'},{code:'DEMO'+(i+1)+'B',date:'2026/11/05'}]}));function renderCodes(){let q=document.getElementById('codeSearch').value;document.getElementById('codes').innerHTML=codeData.filter(g=>g.name.includes(q)).map((g)=>`<div class="card"><h3>${g.name}</h3>${g.items.map(c=>`<p><b>${c.code}</b> <span class="muted">${c.date}</span> <button onclick="copy('${c.code}')">複製</button></p>`).join('')}<button class="primary" onclick="copy(${JSON.stringify(g.items.map(c=>c.code).join('\n')).replaceAll('"','&quot;')})">複製全部</button></div>`).join('')}let guideIndex=0,guideMode='guide';function renderGuide(){let name=names[guideIndex];document.getElementById('guideTitle').textContent=name+(guideMode==='guide'?'｜新手攻略':'｜廣告文案');document.getElementById('guideBody').value=guideMode==='guide'?`【${name}｜示例攻略】\n\n一、每日任務與資源規劃\n二、角色培養方向\n三、限時活動注意事項\n\n此內容僅供展示，不代表真實攻略。`:`【${name}｜示例宣傳文案】\n\n整理最新遊戲重點與活動資訊，幫助玩家快速掌握玩法。\n\n正式發布前需核對官方來源。`};function renderGuideGames(){document.getElementById('guideGames').innerHTML=names.slice(0,8).map((n,i)=>`<button onclick="guideIndex=${i};renderGuide()">${n}</button>`).join('')}let y=2026,m=10;const events=names.slice(0,9).map((name,i)=>({name,title:['限時活動','儲值優惠','限定角色活動'][i%3],start:new Date(2026,10+(i%3),3+i*2,10),end:new Date(2026,10+(i%3),12+i*2,23)}));const colors=['#24466b','#246b55','#915c32','#795d9e','#ad5462','#267f8e','#806321','#52678f','#5b7d40'];function changeMonth(n){let d=new Date(y,m+n,1);y=d.getFullYear();m=d.getMonth();renderTimeline()}function renderTimeline(){document.getElementById('month').textContent=`${y} 年 ${m+1} 月`;let last=new Date(y,m+1,0).getDate(),begin=new Date(y,m,1),finish=new Date(y,m+1,1);let out=`<div class="line"><b>遊戲／活動</b><div style="display:flex;justify-content:space-between"><small>1 日</small><small>7 日</small><small>14 日</small><small>21 日</small><small>${last} 日</small></div></div>`;events.forEach((e,i)=>{if(e.end<begin||e.start>=finish)return;let s=Math.max(0,(e.start-begin)/86400000),end=Math.min(last,(e.end-begin)/86400000);out+=`<div class="line"><div><b>${e.name}</b><br><small>${e.title}</small></div><div class="track" title="${e.start.toLocaleString('zh-TW')} ～ ${e.end.toLocaleString('zh-TW')}"><div class="bar" style="left:${s/last*100}%;width:${Math.max(0,end-s)/last*100}%;background:${colors[i]}"></div></div></div>`});document.getElementById('timeline').innerHTML=out}function exportCSV(){let rows=[['遊戲','活動','開始','結束'],...events.map(e=>[e.name,e.title,e.start.toLocaleString('zh-TW'),e.end.toLocaleString('zh-TW')])];let csv='\ufeff'+rows.map(r=>r.join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='活動示例.csv';a.click()}renderGames();renderCodes();renderGuideGames();renderGuide();renderTimeline();</script></body></html>
