<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#EAEAEF">
  <meta name="description" content="追蹤台灣與國際手機遊戲新上市、即將上市、預約及預先註冊，整合 Google Play 和 App Store 公開資料。">
  <title>今日商機｜新遊戲雷達</title>
  <link rel="stylesheet" href="/radar.css?v=20261114a">
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 8 8M4 12h4m-4 0 2 4m-2-4 2-4m7-2 4 5-4 3"/></svg>
      </span>
      <div>
        <div class="eyebrow">今日商機 · 手機遊戲情報</div>
        <h1>新遊戲雷達</h1>
        <p class="subhead">新上市、即將上市、預約／預先註冊 · 台灣優先</p>
      </div>
    </div>
    <div class="sync" role="status" aria-live="polite">
      <strong id="sync-state">正在讀取最新整理…</strong>
      <div id="sync-detail">每三小時整理公開商店資料</div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="primary-nav">
    <nav class="store-tabs" aria-label="遊戲商店篩選">
      <button type="button" class="active" data-store="all" aria-pressed="true">所有</button>
      <button type="button" data-store="Google Play" aria-pressed="false">Google Play</button>
      <button type="button" data-store="App Store" aria-pressed="false">App Store</button>
    </nav>
    <nav class="market-tabs" aria-label="地區篩選">
      <label for="market-filter" class="subhead">市場</label>
      <select class="select" id="market-filter">
        <option value="all">台灣＋國際</option>
        <option value="TW">台灣</option>
        <option value="INT">國際</option>
      </select>
    </nav>
  </div>
  <nav class="status-tabs" aria-label="上市階段">
    <button type="button" class="active" data-category="新上市" aria-pressed="true">新上市</button>
    <button type="button" data-category="即將上市" aria-pressed="false">即將上市</button>
    <button type="button" data-category="預約／預先註冊" aria-pressed="false">預約／預先註冊</button>
    <button type="button" data-category="全部遊戲" aria-pressed="false">全部遊戲</button>
  </nav>
  <div class="toolbar">
    <div class="search" role="search">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
      <input id="game-search" type="search" autocomplete="off" placeholder="搜尋遊戲名稱、中文／英文別名或商店 ID" aria-label="搜尋所有已收錄遊戲">
      <button id="search-clear" type="button" title="清除搜尋" aria-label="清除搜尋">×</button>
    </div>
    <div class="tools">
      <label class="subhead" for="game-order">排序</label>
      <select class="select" id="game-order"><option value="new">日期由新到舊</option><option value="old">日期由舊到新</option></select>
    </div>
  </div>
  <div id="results-heading" class="resultbar">
    <div>
      <h2 id="result-title">正在整理遊戲…</h2>
      <p id="result-caption">同款遊戲合併顯示；上架日期與預約狀態依國別保留。</p>
    </div>
    <span class="subhead">點選「詳細資訊」查看所有國家與原始來源</span>
  </div>
  <section class="panel" aria-label="遊戲雷達清單">
    <div id="game-list"><div class="empty">正在讀取 Google Play 與 App Store 資料…</div></div>
    <div class="pagination" id="pagination"></div>
  </section>
  <details class="health">
    <summary>資料來源與異常檢查</summary>
    <p id="health-description">載入來源狀態中…</p>
    <ul id="health-errors"></ul>
    <small id="health-time"></small>
  </details>
  <p class="foot">資料優先取自 Google Play、App Store 與其公開搜尋來源。商店首次偵測時間不等於官方首次上架日期；未公告的日期不會自行填入。每日 12:00 提供最新雷達摘要。</p>
</main>
<dialog id="detail-dialog" aria-label="遊戲詳細資訊">
  <div class="dialog-head"><h2 id="dialog-title">遊戲詳細資訊</h2><button type="button" id="dialog-close" class="close" aria-label="關閉詳細資訊">×</button></div>
  <div class="dialog-body" id="dialog-body"></div>
</dialog>
<script type="module" src="/radar.js?v=20261114a"></script>
</body>
</html>
