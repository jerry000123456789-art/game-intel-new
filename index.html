<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球遊戲情報中心</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#2D3142;background:#EAEAEF;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #d6deea;padding:18px max(24px,4vw)}h1{margin:0;color:#244568;font-size:27px}h2{font-size:23px;margin:0 0 14px}h3{margin:0 0 8px;font-size:18px}.muted{color:#65758b;font-size:14px}.wrap{max-width:1480px;margin:auto;padding:24px}button,input,select{font:inherit;border:1px solid #cad6e3;border-radius:12px;padding:11px 13px;background:#fff;color:inherit}button{cursor:pointer}button:hover{border-color:#196d63}.active{background:#244568;color:#fff}.sub.active{background:#196d63;color:#fff}.tabs,.subtabs,.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}.filters input{flex:1;min-width:170px}.panel{background:#fff;border:1px solid #d4deea;border-radius:18px;padding:24px;margin-bottom:20px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{border:1px solid #d5dfeb;border-radius:16px;padding:18px;min-width:0;background:white}.card img{width:100%;height:160px;object-fit:cover;border-radius:10px;background:#eef2f7}.card h3{overflow-wrap:anywhere}.tag{display:inline-block;border-radius:20px;background:#e0eff1;color:#12645b;padding:3px 9px;font-size:12px;margin:5px 4px 5px 0}.item{padding:14px 0;border-bottom:1px solid #e1e7ee;overflow-wrap:anywhere}.item a{color:#204c78}.three{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:16px}.side button{display:block;width:100%;text-align:left;margin:7px 0}.article{white-space:pre-wrap;line-height:1.8}dialog{border:0;border-radius:18px;max-width:min(740px,94vw);width:100%;max-height:85vh;overflow:auto;padding:24px;color:inherit}dialog::backdrop{background:#14273a99}.timeline{overflow:auto}.timeline table{border-collapse:collapse;min-width:100%;font-size:13px}.timeline th,.timeline td{border:1px solid #e1e7ed;padding:9px;white-space:nowrap}.timeline th{background:#f3f6fa}.bar{height:24px;border-radius:6px;min-width:12px;cursor:pointer}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.empty{padding:22px;background:#f4f6f9;border-radius:14px;color:#64748b}.toast{position:fixed;bottom:20px;right:20px;background:#244568;color:white;padding:12px 20px;border-radius:12px;display:none;z-index:5}a{color:#20527b}small{color:#63748a}@media(max-width:850px){.three{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:16px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
</style></head><body><header><h1>🎮 全球遊戲情報中心</h1><div class="muted">遊戲資訊 · 兌換碼 · 攻略 · 活動時間軸</div></header><main class="wrap"><nav class="tabs" id="tabs"><button class="active" data-page="news">遊戲資訊</button><button data-page="codes">兌換碼</button><button data-page="guides">遊戲攻略</button><button data-page="calendar">活動行事曆</button></nav>
<section id="news"><nav class="subtabs" id="newsTabs"><button class="sub active" data-sub="updates">最新遊戲情報</button><button class="sub" data-sub="launches">新上市／即將上市</button></nav><div id="updates" class="panel"><h2>最新遊戲情報</h2><div class="muted" id="newsInfo"></div><div class="filters"><input id="newsQ" placeholder="搜尋遊戲、新聞或來源"><select id="newsCat"><option value="">全部分類</option><option>新遊戲資訊</option><option>兌換碼</option><option>遊戲攻略</option><option>活動行事曆</option></select><select id="newsSort"><option value="new">最新優先</option><option value="old">最舊優先</option></select></div><div id="newsList"></div></div><div id="launches" class="panel hidden"><h2>新上市／即將上市</h2><p class="muted" id="catalogInfo">依遊戲商店目錄顯示，不將新聞線索當成已確認上市日期。</p><div class="filters"><input id="gameQ" placeholder="搜尋遊戲名稱"><select id="gameStatus"><option value="">全部狀態</option><option>即將上市</option><option>新上市</option><option>預先註冊</option><option>已上市</option></select><select id="gameRegion"><option value="">全部地區</option></select></div><div id="gameGrid" class="grid"></div></div></section>
<section id="codes" class="panel hidden"><h2>兌換碼</h2><p class="muted">只列出已擷取到代碼文字的資料；新聞標題不是可兌換代碼。</p><div class="filters"><input id="codeQ" placeholder="搜尋遊戲或代碼"></div><div id="codeList" class="grid"></div><h3 style="margin-top:24px">兌換碼來源線索</h3><div class="muted">以下僅供查找原文，不會假裝已取得有效代碼。</div><div id="codeLeads"></div></section>
<section id="guides" class="hidden"><div class="three"><aside class="panel side"><h3>選擇遊戲</h3><input id="guideQ" placeholder="搜尋遊戲" style="width:100%"><div id="guideGames"></div></aside><div class="panel"><h2 id="guideTitle">遊戲攻略</h2><div class="subtabs" id="guideCategories"></div><div id="guideArticles"></div><article class="article" id="guideArticle"></article></div><aside class="panel"><h3>分享文案</h3><div id="shareText" class="article muted">選擇有內容的攻略後，可產生附來源的分享文字。</div><button id="copyShare">複製文案</button><hr><h3>資料原則</h3><p class="muted">僅顯示已收錄的攻略內容或原始來源。沒有全文的新聞線索不會自動生成虛構攻略。</p></aside></div></section>
<section id="calendar" class="panel hidden"><div class="toolbar"><h2>遊戲活動行事曆</h2><div><button id="prevMonth">‹ 上個月</button> <strong id="monthLabel"></strong> <button id="nextMonth">下個月 ›</button> <button id="exportCSV">匯出 CSV</button></div></div><p class="muted">僅呈現有明確起迄日期的遊戲活動；新聞提及的日期不會直接當成活動日期。</p><div class="filters"><input id="eventQ" placeholder="搜尋遊戲或活動"><select id="eventRegion"><option value="">全部地區</option></select></div><div id="calendarView" class="timeline"></div></section></main><dialog id="detail"><div class="toolbar"><h2 id="detailTitle"></h2><button onclick="document.getElementById('detail').close()">關閉 ✕</button></div><div id="detailBody"></div></dialog><div class="toast" id="toast"></div>
<script>
'use strict';const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=s=>/^https:\/\//i.test(s||'')?s:'#';const link=(u,label)=>u?`<a href="${safe(url(u))}" target="_blank" rel="noopener noreferrer">${safe(label)}</a>`:'';let db={news:[],games:[],codes:[],guides:[],events:[],updated:''};const fmt=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?String(s):d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};const toast=t=>{let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2300)};async function copy(s){try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(s);else{let t=document.createElement('textarea');t.value=s;t.style.position='fixed';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}toast('已複製')}catch{toast('複製失敗，請手動選取')}}async function load(path){try{let r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}catch(e){console.warn(path,e);return null}}function items(x){return Array.isArray(x)?x:Array.isArray(x?.items)?x.items:[]}
function renderNews(){let q=$('newsQ').value.toLowerCase(),cat=$('newsCat').value,arr=db.news.filter(x=>(!cat||x.category===cat)&&(`${x.title} ${x.publisher}`.toLowerCase().includes(q)));if($('newsSort').value==='old')arr.reverse();$('newsInfo').textContent=`目前收錄 ${db.news.length} 筆公開情報標題；來源資料更新：${fmt(db.updated)||'未提供'}。請以原始來源為準。`;$('newsList').innerHTML=arr.length?arr.slice(0,250).map(x=>`<div class="item"><span class="tag">${safe(x.category||'遊戲情報')}</span> ${link(x.url||x.source_url,x.title||'原始情報')}<div class="muted">${safe(x.publisher||'')} · ${fmt(x.published_at)}</div></div>`).join(''):'<div class="empty">沒有符合條件的情報。</div>'}
function normalizeGame(x){return {...x,name:x.name||x.title||'',platforms:Array.isArray(x.platforms)?x.platforms:[],store_links:Array.isArray(x.store_links)?x.store_links:[],payment_methods:Array.isArray(x.payment_methods)?x.payment_methods:[]}}function uniqueGames(){let m=new Map();for(let x of db.games.map(normalizeGame)){if(!x.name)continue;let k=x.name.trim().toLocaleLowerCase();if(!m.has(k))m.set(k,{...x});else{let a=m.get(k);a.platforms=[...new Set([...a.platforms,...x.platforms])];a.store_links=[...a.store_links,...x.store_links].filter((v,i,arr)=>arr.findIndex(t=>t.url===v.url)===i);if(!a.cover_url)a.cover_url=x.cover_url;if(!a.release_date)a.release_date=x.release_date;if(!a.developer)a.developer=x.developer}}return [...m.values()]}
function detail(title,html){$('detailTitle').textContent=title;$('detailBody').innerHTML=html;$('detail').showModal()}function gameDetail(g){let methods=g.payment_methods.map(p=>typeof p==='string'?p:p.name).filter(Boolean);detail(g.name,`${g.cover_url?`<img src="${safe(url(g.cover_url))}" alt="" style="width:100%;max-height:300px;object-fit:contain">`:''}<p>${g.status?`<span class="tag">${safe(g.status)}</span>`:''} ${safe(g.region||'')}</p>${g.developer?`<p><b>開發商：</b>${safe(g.developer)}</p>`:''}${g.release_date?`<p><b>商店記錄日期：</b>${safe(g.release_date)}</p>`:''}<p><b>平台：</b>${safe(g.platforms.join('、')||'未提供')}</p><h3>遊戲商店</h3>${g.store_links.length?g.store_links.map(s=>`<div class="item">${link(s.url,s.name||'商店頁面')} ${safe(s.region||'')}</div>`).join(''):'<p class="muted">尚無商店連結</p>'}${methods.length?`<h3>已記錄付款方式</h3><p>${safe(methods.join('、'))}</p>`:''}${g.source_url?`<p>${link(g.source_url,'查看原始來源')}</p>`:''}`)}function renderGames(){let all=uniqueGames(),q=$('gameQ').value.toLowerCase(),status=$('gameStatus').value,region=$('gameRegion').value;let arr=all.filter(g=>(!q||g.name.toLowerCase().includes(q))&&(!status||String(g.status||'').includes(status))&&(!region||g.region===region));$('catalogInfo').textContent=`已收錄 ${all.length} 款商店遊戲，符合篩選 ${arr.length} 款。上市日期與支付方式僅顯示來源已有的資料。`;$('gameGrid').innerHTML=arr.length?arr.map((g,i)=>`<div class="card">${g.cover_url?`<img loading="lazy" src="${safe(url(g.cover_url))}" alt="${safe(g.name)}">`:''}<h3>${safe(g.name)}</h3><div><span class="tag">${safe(g.status||'商店收錄')}</span>${g.region?`<span class="tag">${safe(g.region)}</span>`:''}</div><p>${safe(g.platforms.join('、'))}</p>${g.release_date?`<p>日期：${safe(g.release_date)}</p>`:''}<button data-game="${i}">遊戲資訊</button></div>`).join(''):'<div class="empty">目前沒有符合條件的遊戲商店資料。請確認自動蒐集結果或調整篩選。</div>';$('gameGrid').querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>gameDetail(arr[+b.dataset.game]))}
function renderCodes(){let q=$('codeQ').value.toLowerCase(),arr=db.codes.filter(x=>`${x.game} ${x.code}`.toLowerCase().includes(q)),m={};for(let x of arr){if(!x.game||!x.code)continue;(m[x.game]??=[]).push(x)}$('codeList').innerHTML=Object.entries(m).length?Object.entries(m).map(([game,cs],i)=>`<div class="card"><h3>${safe(game)}</h3>${cs.map((c,j)=>`<div class="item"><b>${safe(c.code)}</b> <button data-one="${i}:${j}">複製</button><div class="muted">${fmt(c.discovered_at||c.published_at)} ${c.expired===true?'· 已過期':''}</div>${link(c.source_url,'來源')}</div>`).join('')}<button class="active" data-all="${i}">複製全部</button></div>`).join(''):'<div class="empty">尚未取得可直接複製的兌換碼。下方提供已蒐集的相關來源，需確認原文後才會加入代碼。</div>';$('codeList').querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.one.split(':').map(Number);copy(Object.values(m)[i][j].code)});$('codeList').querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>copy(Object.values(m)[+b.dataset.all].map(x=>x.code).join('\n')));let leads=db.news.filter(x=>x.category==='兌換碼');$('codeLeads').innerHTML=leads.slice(0,50).map(x=>`<div class="item">${link(x.url||x.source_url,x.title)}<div class="muted">${safe(x.publisher||'')} · ${fmt(x.published_at)}</div></div>`).join('')||'<div class="empty">暫無來源線索。</div>'}
let selectedGuide='';function renderGuides(){let gs=[...new Set(db.guides.map(x=>x.game).filter(Boolean))],q=$('guideQ').value.toLowerCase();$('guideGames').innerHTML=gs.filter(x=>x.toLowerCase().includes(q)).map(x=>`<button data-g="${safe(x)}" class="${x===selectedGuide?'active':''}">${safe(x)}</button>`).join('')||'<div class="muted">尚未收錄完整攻略文章</div>';$('guideGames').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{selectedGuide=b.dataset.g;renderGuides()});if(!selectedGuide&&gs.length)selectedGuide=gs[0];let arr=db.guides.filter(x=>x.game===selectedGuide),cats=[...new Set(arr.map(x=>x.category||'攻略'))];$('guideTitle').textContent=selectedGuide||'遊戲攻略';$('guideCategories').innerHTML=cats.map(c=>`<span class="tag">${safe(c)}</span>`).join('');$('guideArticles').innerHTML=arr.map((x,i)=>`<div class="item"><button data-article="${i}">${safe(x.title)}</button><div class="muted">${fmt(x.updated_at)} ${link(x.source_url,'原始來源')}</div></div>`).join('')||'<div class="empty">目前沒有已整理的完整攻略。可從最新遊戲情報查找原始攻略，經整理與來源核對後才會顯示文章。</div>';$('guideArticles').querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>{let x=arr[+b.dataset.article];$('guideArticle').textContent=x.content||x.summary||'';let t=`【${x.game}】${x.title}\n${(x.summary||x.content||'').slice(0,600)}\n來源：${x.source_url||''}`;$('shareText').textContent=t});}
let month=new Date();month.setDate(1);function renderCalendar(){let yy=month.getFullYear(),mm=month.getMonth(),days=new Date(yy,mm+1,0).getDate();$('monthLabel').textContent=`${yy} 年 ${mm+1} 月`;let q=$('eventQ').value.toLowerCase(),r=$('eventRegion').value,from=new Date(yy,mm,1),to=new Date(yy,mm+1,1);let arr=db.events.filter(e=>e.start_at&&e.end_at&&new Date(e.start_at)<to&&new Date(e.end_at)>=from&&(!q||`${e.game} ${e.title}`.toLowerCase().includes(q))&&(!r||e.region===r));if(!arr.length){$('calendarView').innerHTML='<div class="empty">這個月份沒有已核實起迄日期的遊戲活動。</div>';return}let games=[...new Set(arr.map(x=>x.game))];const gameColor=name=>`hsl(${Math.round((games.indexOf(name)*137.508)%360)} 57% 37%)`;let html='<table><thead><tr><th>遊戲／活動</th>'+Array.from({length:days},(_,i)=>`<th>${i+1}</th>`).join('')+'</tr></thead><tbody>';for(let e of arr.sort((a,b)=>a.game.localeCompare(b.game)||a.start_at.localeCompare(b.start_at))){let start=new Date(e.start_at),end=new Date(e.end_at),c=gameColor(e.game);html+=`<tr><td><button class="event-detail" data-event="${db.events.indexOf(e)}" style="text-align:left"><b>${safe(e.game)}</b><div>${safe(e.title)}</div></button></td>`;for(let i=1;i<=days;i++){let d=new Date(yy,mm,i);html+=`<td>${d>=new Date(start.getFullYear(),start.getMonth(),start.getDate())&&d<=new Date(end.getFullYear(),end.getMonth(),end.getDate())?`<div class="bar" style="background:${c}" title="${safe(e.title)}"></div>`:''}</td>`}html+='</tr>'}html+='</tbody></table>';$('calendarView').innerHTML=html;document.querySelectorAll('.event-detail').forEach(b=>b.onclick=()=>{let e=db.events[+b.dataset.event];detail(e.title,`<p><b>遊戲：</b>${safe(e.game)}</p><p><b>地區：</b>${safe(e.region||'')}</p><p><b>活動時間：</b>${safe(e.start_at)} ～ ${safe(e.end_at)}</p><p><b>活動類型：</b>${safe(e.category||'')}</p><p>${safe(e.topup_notes||'')}</p>${link(e.source_url,'官方或原始來源')}`)})}
function exportCSV(){let cols=['game','title','start_at','end_at','region','category','topup_notes','source_url'],rows=[cols,...db.events.map(x=>cols.map(k=>x[k]??''))];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='game-events.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));for(let id of ['news','codes','guides','calendar'])$(id).classList.toggle('hidden',id!==b.dataset.page)});$('newsTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#newsTabs button').forEach(x=>x.classList.toggle('active',x===b));for(let id of ['updates','launches'])$(id).classList.toggle('hidden',id!==b.dataset.sub)});for(let id of ['newsQ','newsCat','newsSort'])$(id).addEventListener('input',renderNews);for(let id of ['gameQ','gameStatus','gameRegion'])$(id).addEventListener('input',renderGames);$('codeQ').oninput=renderCodes;$('guideQ').oninput=renderGuides;$('copyShare').onclick=()=>copy($('shareText').textContent);$('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);renderCalendar()};$('eventQ').oninput=renderCalendar;$('eventRegion').onchange=renderCalendar;$('exportCSV').onclick=exportCSV;
(async()=>{let [n,g,c,co,gu,ev]=await Promise.all(['data/latest.json','data/game_catalog.json','data/classified.json','data/codes.json','data/guides.json','data/events.json'].map(load));db.news=items(n);db.updated=n?.updated_at||'';db.games=items(g);db.codes=items(co);db.guides=items(gu);db.events=items(ev);let regions=[...new Set(db.games.map(x=>x.region).filter(Boolean))];$('gameRegion').innerHTML+=[...regions].map(x=>`<option>${safe(x)}</option>`).join('');$('eventRegion').innerHTML+=[...new Set(db.events.map(x=>x.region).filter(Boolean))].map(x=>`<option>${safe(x)}</option>`).join('');renderNews();renderGames();renderCodes();renderGuides();renderCalendar()})();
</script></body></html>
